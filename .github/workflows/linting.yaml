name: Linting

on: pull_request

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"

      - run: npm ci

      - name: Check Prettier formatting
        run: npm run lint:prettier:check

      - name: Run ESLint
        run: npm run lint
